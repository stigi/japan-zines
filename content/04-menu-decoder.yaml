- title: ASK FOR THEM
  entries:
  - - 妻と娘は
    - tsuma to musume wa
    - My wife and daughter…
  - - ベジタリアンです。
    - bejitarian desu.
    - …are vegetarian.
  - - 肉も魚も食べません。
    - niku mo sakana mo tabemasen.
    - They eat neither meat nor fish.
  - - 魚のだしは入っていますか？
    - sakana no dashi wa haitte imasu ka?
    - Does it contain fish stock?
- title: CHECK & ORDER
  entries:
  - - 肉や魚なしでできますか？
    - niku ya sakana nashi de dekimasu ka?
    - Can you make it without meat or fish?
  - - 昆布だしですか？
    - konbu dashi desu ka?
    - Is it kelp stock?
  - - これを二つください。
    - kore o futatsu kudasai.
    - Two of these, please.
  - - ありがとうございます。
    - arigatō gozaimasu.
    - Thank you very much.
